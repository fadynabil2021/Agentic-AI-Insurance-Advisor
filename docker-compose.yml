version: "3.9"

services:

  ollama:
    image: ollama/ollama:latest
    container_name: insurance-ollama
    volumes:
      - /home/fady/.ollama:/root/.ollama
    ports:
      - "11435:11434"
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama-init:
    image: curlimages/curl:latest
    container_name: insurance-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Pulling gemma4:31b-cloud...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"gemma4:31b-cloud\"}' --max-time 3600 &&
        echo 'Pulling nomic-embed-text...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}' --max-time 600 &&
        echo 'Model pulls complete.'
      "
    restart: "no"

  chromadb:
    image: chromadb/chroma:0.5.18
    container_name: insurance-chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: "8000"
      ANONYMIZED_TELEMETRY: "false"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: insurance-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:16-alpine
    container_name: insurance-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U langfuse" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: insurance-langfuse
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse"
      NEXTAUTH_SECRET: "local-dev-secret-change-in-prod"
      NEXTAUTH_URL: "http://localhost:3001"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      SALT: "local-dev-salt-change-in-prod"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance-backend
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
      langfuse:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "gemma4:31b-cloud"
      OLLAMA_EMBED_MODEL: "nomic-embed-text"
      OLLAMA_TIMEOUT: "120"
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"
      REDIS_URL: "redis://redis:6379/0"
      CACHE_TTL_SECONDS: "300"
      LANGFUSE_HOST: "http://langfuse:3000"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
      MAX_RETRIES: "2"
      MIN_CONFIDENCE_THRESHOLD: "0.4"
    volumes:
      - ./backend:/app
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
  redis_data:
  langfuse_postgres_data:
