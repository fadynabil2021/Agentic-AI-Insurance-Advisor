[phases.setup]
nixPkgs = ["python3", "gcc", "stdenv.cc.cc.lib", "zlib"]

[phases.install.variables]
LD_LIBRARY_PATH = "/nix/store/*/lib"

[phases.install]
dependsOn = ["setup"]
cmds = [
    "python3 -m venv /opt/venv",
    "/opt/venv/bin/pip install --no-cache-dir -r backend/requirements.txt"
]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "cd backend && /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
