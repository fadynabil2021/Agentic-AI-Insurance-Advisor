[phases.setup]
nixPkgs = ["python3", "gcc", "stdenv.cc.cc.lib"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "python3 -m venv /opt/venv",
    "/opt/venv/bin/pip install --no-cache-dir -r backend/requirements.txt"
]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "/opt/venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
